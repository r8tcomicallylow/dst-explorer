[package]
name = "dst-explorer"
version = "1.3.3"
edition = "2021"
description = "A fast, minimal desktop browser and download manager for DoujinStyle.com"
license = "MIT"
repository = "https://github.com/yourusername/dst-explorer"
homepage = "https://github.com/yourusername/dst-explorer"
readme = "README.md"
keywords = ["doujin", "music", "downloader", "doujinstyle", "gui", "egui"]
categories = ["command-line-utilities", "development-tools"]

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["taskbar-progress"]
taskbar-progress = ["dep:windows"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
raw-window-handle = "0.6"
egui = "0.29.1"
fluent = "0.17"
fluent-bundle = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "brotli", "cookies"] }
scraper = "0.23"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "2.2.1", default-features = false, features = ["deflate"] }
dirs = "5"
percent-encoding = "2"
crossbeam-channel = "0.5"
webbrowser = "1"
rfd = "0.15"
notify-rust = "4.18"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
chrono = "0.4"
regex = "1"
md-5 = "0.10"
base64 = "0.22"
crossterm = "0.28"
# Only the output device, `Sink` and mixer are used. Decoding goes through the
# `SymphoniaSource` in `audio.rs` because rodio's own decoder loses the file
# length (`ReadSeekSource::byte_len` is always `None`), which broke seeking for
# FLAC/OGG. Disabling rodio's decoders also keeps claxon/lewton/hound out of
# the build.
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
env_logger = "0.11"
windows = { version = "0.60", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole"], optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"