name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Build release
        run: cargo build --release
      
      - name: Prepare artifacts
        run: |
          mkdir release
          copy target\release\dst-explorer.exe release\dst-explorer-windows-x64.exe
          copy LICENSE release\
          copy README.md release\
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dst-explorer-windows-x64.exe
            release/LICENSE
            release/README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            pkg-config build-essential curl
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Build release
        run: cargo build --release
      
      - name: Prepare artifacts
        run: |
          mkdir release
          cp target/release/dst-explorer release/dst-explorer-linux-x64
          cp LICENSE release/
          cp README.md release/
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dst-explorer-linux-x64
            release/LICENSE
            release/README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Build release (x86_64)
        run: cargo build --release --target x86_64-apple-darwin
      
      - name: Build release (aarch64)
        run: cargo build --release --target aarch64-apple-darwin
      
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/dst-explorer \
            target/aarch64-apple-darwin/release/dst-explorer \
            -output dst-explorer-macos-universal
      
      - name: Prepare artifacts
        run: |
          mkdir release
          cp dst-explorer-macos-universal release/
          cp LICENSE release/
          cp README.md release/
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dst-explorer-macos-universal
            release/LICENSE
            release/README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}